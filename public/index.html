<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Bread</title>
<meta name="description" content="Make more. Waste less. Gather often. Recipes from what you have, a personal cookbook, and from-scratch cooking lessons.">
<meta name="theme-color" content="#F7F3EB">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F3EB;--sage:#D9DFCE;--olive:#A7AD91;--terra:#B77D67;--brown:#795C49;--rose:#E8CFC8;
  --bg:#F7F3EB;--surface:#FFFDF8;--ink:#3F2E22;--muted:#7A6555;--line:#E6DDCD;--chip:#EEE8DC;
  --btn:#795C49;--btn-ink:#FBF7EF;--accent:#B77D67;--good:#5F6B47;--good-bg:#E4E8D9;--warn:#9C4E34;--warn-bg:#F4E1D8;
  --paper:#FFFBF2;--rule:#E9DFCB;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211C17;--surface:#2B241E;--ink:#F1E8D9;--muted:#BFAB97;--line:#3D342B;--chip:#352D25;
    --btn:#D9C2A7;--btn-ink:#241D17;--accent:#D29B84;--good:#C3CD9F;--good-bg:#343A2A;--warn:#EFA486;--warn-bg:#3F2A22;
    --paper:#2F2720;--rule:#3E352B;--sage:#353B2E;--olive:#8F977A;--rose:#4A3733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211C17;--surface:#2B241E;--ink:#F1E8D9;--muted:#BFAB97;--line:#3D342B;--chip:#352D25;
  --btn:#D9C2A7;--btn-ink:#241D17;--accent:#D29B84;--good:#C3CD9F;--good-bg:#343A2A;--warn:#EFA486;--warn-bg:#3F2A22;
  --paper:#2F2720;--rule:#3E352B;--sage:#353B2E;--olive:#8F977A;--rose:#4A3733;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 20px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2;letter-spacing:-.005em}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack>*+*{margin-top:12px}
.section{margin-top:30px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:.9rem}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.15rem}
.brand svg{width:26px;height:26px;color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* Verse — the signature recipe card */
.card-verse{position:relative;margin-top:14px;background:var(--paper);border-radius:4px 4px 14px 4px;padding:22px 20px 18px 34px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-position:0 44px;box-shadow:0 1px 0 var(--line),0 8px 22px -14px rgba(90,60,40,.35);transform:rotate(-.6deg)}
.card-verse::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1.5px;background:var(--accent);opacity:.55}
.card-verse .vt{font-family:var(--serif);font-size:1.18rem;line-height:28px}
.card-verse .vr{font-family:var(--hand);font-size:1.45rem;color:var(--accent);margin-top:6px;line-height:1.1}
.verse-inline{border-left:2px solid var(--olive);padding:4px 0 4px 14px;margin-top:22px}
.verse-inline .vt{font-family:var(--serif);font-size:.98rem;line-height:1.55}
.verse-inline .vr{font-family:var(--hand);font-size:1.2rem;color:var(--accent);line-height:1.1;margin-top:2px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.ask{background:var(--sage);border:0}
.ask h2{margin-bottom:4px}
textarea.field,input.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none}
textarea.field{resize:vertical;min-height:84px;line-height:1.45}
textarea.field:focus,input.field:focus,select.field:focus{border-color:var(--accent)}
label.lbl{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:1rem}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--btn);color:var(--ink)}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}

/* Recipe cards */
.rlist{display:grid;gap:12px}
.rcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.plate{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:radial-gradient(circle at 50% 50%,var(--surface) 0 52%,var(--sage) 53% 100%);box-shadow:inset 0 0 0 1px var(--line)}
.plate.lg{width:96px;height:96px;font-size:2.8rem}
.rcard .t{font-family:var(--serif);font-size:1.04rem;line-height:1.25}
.rcard .m{font-size:.85rem;color:var(--muted);margin-top:3px}
.have{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.feature{display:block;width:100%;text-align:left;border:0;border-radius:20px;padding:20px;background:var(--rose);color:var(--ink)}
.feature .row{gap:16px}
.feature .t{font-family:var(--serif);font-size:1.3rem;line-height:1.2}

/* Pantry */
.pgroup h3{font-size:1rem;margin:22px 0 8px}
.pitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pitem .n{flex:1;min-width:0}
.pitem .n b{font-weight:600}
.badge{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.soon{background:var(--rose);color:var(--ink)}
.usesoon{display:flex;gap:8px;flex-wrap:wrap}

/* Bottom nav: icons only, per Rooted Co pattern */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 8px}
.nav button{width:52px;height:48px;border:0;background:none;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
.nav button svg{width:25px;height:25px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--chip)}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:520px;margin:0 auto;padding:0 20px 60px}
.sheet-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;background:var(--bg)}
.hero{text-align:center;padding:4px 0 6px}
.hero .plate{margin:0 auto 14px}
.meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-weight:600;font-size:1rem}
.aiflag{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:600;background:var(--chip);color:var(--muted);padding:4px 10px;border-radius:999px}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.dot.y{background:var(--good-bg);color:var(--good)}
.dot.n{border:1.5px dashed var(--olive)}
.ing .q{font-weight:600}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-family:var(--serif);font-size:.95rem}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nutri div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.nutri b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;background:none;font-size:1.2rem}
.stepper span{min-width:64px;text-align:center;font-weight:600}
.sticky-actions{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.sticky-actions .btn{flex:1}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:.9rem}
.err{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.92rem}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--olive);animation:b 1s infinite alternate}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.25;transform:translateY(-3px)}}
.bubble{padding:12px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;line-height:1.5}
.bubble.me{background:var(--btn);color:var(--btn-ink);margin-left:auto;border-bottom-right-radius:4px}
.bubble.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--brown);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--olive)}
.progress{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--olive);border-radius:99px}
.path{margin-top:26px}
.path>h2{margin-bottom:4px}
.tcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.tcard .t{font-family:var(--serif);font-size:1.05rem}
.tcard.soon{opacity:.6;cursor:default}
.empty{text-align:center;padding:30px 10px;border:1.5px dashed var(--line);border-radius:18px}
.empty p+p{margin-top:6px}
.empty .btn{margin-top:16px}
dl.tr{margin:0}
dl.tr dt{font-weight:600;margin-top:12px}
dl.tr dd{margin:2px 0 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:80;max-width:90vw;text-align:center}

/* Cook With Me */
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cook-in{max-width:620px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px))}
.cook .bar{display:flex;justify-content:space-between;align-items:center}
.cook .count{font-family:var(--hand);font-size:1.6rem;color:var(--accent)}
.cook .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.cook .body p{font-family:var(--serif);font-size:clamp(1.45rem,5.6vw,2.1rem);line-height:1.35}
.cook .nav2{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.cook .nav2 .btn{padding:22px;font-size:1.15rem;border-radius:20px}
.timer{display:inline-flex;align-items:center;gap:10px;margin-top:22px;align-self:flex-start}
.timer b{font-family:var(--serif);font-weight:400;font-size:1.6rem}

/* Onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.ob .skip{align-self:flex-end;background:none;border:0;color:var(--muted);font-weight:600;padding:8px}
.ob .art{flex:1;display:grid;place-items:center;min-height:220px}
.ob .art svg{width:150px;height:150px;color:var(--accent)}
.ob .art .ring{width:210px;height:210px;border-radius:50%;background:var(--sage);display:grid;place-items:center}
.ob h1{font-size:2.15rem}
.ob .lead{margin-top:10px;font-size:1.06rem;color:var(--muted);max-width:34ch}
.dots{display:flex;gap:7px;margin:26px 0 18px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s}
.dots i.on{width:24px;background:var(--brown)}
.core{font-family:var(--serif);font-size:2.25rem;line-height:1.18}
.core-ref{font-family:var(--hand);font-size:1.7rem;color:var(--accent);margin-top:8px}
.hh{display:flex;align-items:center;gap:14px}
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="fileScan" accept="image/*" capture="environment" hidden>
<input type="file" id="fileShot" accept="image/*" hidden>

<script>
/* ---------- Scripture (KJV, public domain) ---------- */
const VERSES = [
  {t:"Give us this day our daily bread.", r:"Matthew 6:11"},
  {t:"And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.", r:"John 6:35"},
  {t:"When they were filled, he said unto his disciples, Gather up the fragments that remain, that nothing be lost.", r:"John 6:12"},
  {t:"O taste and see that the LORD is good: blessed is the man that trusteth in him.", r:"Psalm 34:8"},
  {t:"But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.", r:"Matthew 4:4"},
  {t:"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.", r:"1 Corinthians 10:31"},
  {t:"Go thy way, eat thy bread with joy, and drink thy wine with a merry heart; for God now accepteth thy works.", r:"Ecclesiastes 9:7"},
  {t:"When thou hast eaten and art full, then thou shalt bless the LORD thy God for the good land which he hath given thee.", r:"Deuteronomy 8:10"},
  {t:"It is of the LORD’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.", r:"Lamentations 3:22–23"},
  {t:"The eyes of all wait upon thee; and thou givest them their meat in due season.", r:"Psalm 145:15"},
  {t:"Better is a dinner of herbs where love is, than a stalled ox and hatred therewith.", r:"Proverbs 15:17"},
  {t:"And they, continuing daily with one accord in the temple, and breaking bread from house to house, did eat their meat with gladness and singleness of heart.", r:"Acts 2:46"},
  {t:"But my God shall supply all your need according to his riches in glory by Christ Jesus.", r:"Philippians 4:19"},
  {t:"And it came to pass, as he sat at meat with them, he took bread, and blessed it, and brake, and gave to them.", r:"Luke 24:30"},
  {t:"She looketh well to the ways of her household, and eateth not the bread of idleness.", r:"Proverbs 31:27"},
  {t:"The kingdom of heaven is like unto leaven, which a woman took, and hid in three measures of meal, till the whole was leavened.", r:"Matthew 13:33"}
];
const V = r => VERSES.find(v=>v.r===r);
const verseOfDay = () => { const d=new Date(); const n=Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); return VERSES[n % VERSES.length]; };

/* ---------- Icons ---------- */
const I = {
  wheat:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M16 30V9"/><path d="M16 9c-2.4-1.3-3.2-3.6-2.4-6.3 2.5.9 3.3 3.3 2.4 6.3zm0 0c2.4-1.3 3.2-3.6 2.4-6.3-2.5.9-3.3 3.3-2.4 6.3z" fill="currentColor" fill-opacity=".18"/><path d="M16 15.5c-3-.4-4.8-2.4-5-5.3 2.8.3 4.6 2.3 5 5.3zm0 0c3-.4 4.8-2.4 5-5.3-2.8.3-4.6 2.3-5 5.3z" fill="currentColor" fill-opacity=".18"/><path d="M16 22c-3-.4-4.8-2.4-5-5.3 2.8.3 4.6 2.3 5 5.3zm0 0c3-.4 4.8-2.4 5-5.3-2.8.3-4.6 2.3-5 5.3z" fill="currentColor" fill-opacity=".18"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/></svg>`,
  discover:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>`,
  kitchen:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 10h13M9 6v1.5M9 13v3"/></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M12 7.5c-1.2-1.2-3.2-.4-3 1.3.2 1.4 3 3.2 3 3.2s2.8-1.8 3-3.2c.2-1.7-1.8-2.5-3-1.3z"/></svg>`,

/* ---------- AI: calls our Netlify Function, which holds the API key ---------- */
const AI_URL = "/api/ai";
async function toImage(file){
  // Downsize on the device so uploads stay small and fast.
  const bmp = await createImageBitmap(file).catch(()=>{ throw {code:"image_rejected"}; });
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const data = c.toDataURL("image/jpeg", 0.85).split(",")[1];
  return {media_type:"image/jpeg", data};
}
const sample = async (input, opts={}) => {
  const messages = typeof input === "string" ? [{role:"user", content:input}] : input;
  const list = !opts.images ? [] : (opts.images instanceof Blob ? [opts.images] : Array.from(opts.images));
  const images = await Promise.all(list.slice(0,3).map(toImage));
  let res;
  try{ res = await fetch(AI_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages, images, tier:opts.modelTier||"default"}), signal:opts.signal}); }
  catch(e){ throw {code: e && e.name==="AbortError" ? "cancelled" : "upstream_error"}; }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw {code: data.code || (res.status===429 ? "rate_limited" : "upstream_error"), message: data.error||""};
  if(!data.text) throw {code:"empty_completion"};
  if(opts.onText) opts.onText({text:data.text, delta:data.text});
  return {text:data.text, truncated:!!data.truncated};
};
sample.json = async (input, opts={}) => {
  const ask = typeof input === "string" ? input + "\n\nReply with only the JSON value. No other text, no code fences." : input;
  const {text} = await sample(ask, opts);
  const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/)||[])[1]];
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("]"), text.lastIndexOf("}"));
  if(a>=0 && b>a) tries.push(text.slice(a, b+1));
  for(const t of tries){ if(!t) continue; try{ return JSON.parse(t); }catch(e){} }
  throw {code:"invalid_json", text};
};

function daysLeft(exp){ if(!exp) return null; const d=new Date(exp+"T00:00:00"); return Math.round((d-today0())/864e5); }
function expBadge(exp){
  const n = daysLeft(exp); if(n==null) return "";

const FR = [[0,""],[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,""]];
function fmtQty(q,unit){
  if(q==null||q==="") return "";
  const n = Number(q); if(!isFinite(n)) return String(q);
  if((unit==="g"||unit==="ml") && n>=10) return String(Math.round(n));
  let w = Math.floor(n+1e-9), f = n-w, best = FR[0];
  for(const p of FR) if(Math.abs(p[0]-f) < Math.abs(best[0]-f)) best = p;
  if(Math.abs(best[0]-f) > .06) return String(Math.round(n*10)/10);
  if(best[0]===1){ w+=1; best=FR[0]; }
  return (w? String(w):"") + best[1] || "0";
}
function fmtUnit(u,q){ if(!u) return ""; const pl = Number(q)>1 && ["cup","clove","can","stick","slice"].includes(u); return pl? u+"s" : u; }
function ingLine(i,scale=1){ const q = i.qty==null? null : i.qty*scale; return [fmtQty(q,i.unit), fmtUnit(i.unit,q), i.name].filter(Boolean).join(" "); }
const UNI = {"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function parseQty(s){
  s = s.trim(); let total = 0;
  for(const part of s.split(/\s+/)){
    if(UNI[part]!=null) total += UNI[part];
    else if(/^\d+\/\d+$/.test(part)){ const [a,b]=part.split("/").map(Number); total += b? a/b : 0; }
    else { const m = part.match(/^(\d*\.?\d+)([¼½¾⅓⅔⅛])?$/); if(m){ total += Number(m[1]) + (m[2]?UNI[m[2]]:0); } }
  }

const UNIT_MAP = {cup:"cup",cups:"cup",c:"cup",tablespoon:"tbsp",tablespoons:"tbsp",tbsp:"tbsp",tbs:"tbsp",teaspoon:"tsp",teaspoons:"tsp",tsp:"tsp",pound:"lb",pounds:"lb",lb:"lb",lbs:"lb",ounce:"oz",ounces:"oz",oz:"oz",gram:"g",grams:"g",g:"g",kg:"kg",ml:"ml",l:"l",liter:"l",liters:"l",clove:"clove",cloves:"clove",can:"can",cans:"can",pinch:"pinch",dash:"dash",stick:"stick",sticks:"stick",slice:"slice",slices:"slice"};
function parseLine(line){
  let rest = line.trim().replace(/^[-•*]\s*/,""); let qty = null, unit = "";

}
const STOP = new Set(["fresh","chopped","diced","sliced","minced","large","small","medium","boneless","skinless","cold","cooked","leftover","optional","grated","shredded","halved","plain","ripe","very","and","or","of","the","a","for","plus","more","to","taste","dusting","drained","rinsed","can","oz","beaten","melted","softened","whole","frozen","dried","ground","fine"]);
const sing = w => w.length>3 && w.endsWith("ies") ? w.slice(0,-3)+"y" : (w.length>3 && w.endsWith("es") && /(oes|ches|shes)$/.test(w)) ? w.slice(0,-2) : (w.length>3 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0,-1) : w;
const words = s => String(s).toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w && !STOP.has(w)).map(sing);
function isStaple(name){ const w = words(name); return w.includes("salt") || w.includes("water") || (w.includes("pepper") && w.includes("black")) || (w.length<=2 && w.includes("oil") && !w.includes("sesame")); }
function inPantry(name){
  const iw = words(name.split(",")[0]);
  return state.pantry.some(p => { const pw = words(p.name); return pw.length && pw.every(w => iw.includes(w)); });
}
function haveIt(ing){ return isStaple(ing.name) || inPantry(ing.name) || ing.have===true; }
function matchInfo(r){ const t = r.ingredients.length; const h = r.ingredients.filter(haveIt).length; return {h,t}; }

function aiErr(e){

  if(c==="rate_limited") return "Too many requests right now. Wait a minute, then try again.";
  if(c==="image_rejected") return "That photo couldn’t be read. Try a JPEG or PNG under 20 MB.";

  if(c==="invalid_json"||c==="empty_completion") return "The answer came back incomplete. Try again.";

let cook = null, wake = null, timerInt = null;
async function startCook(){
  cook = {i:0, r:cur.recipe, timer:null};

}
function stepMinutes(s){ const m = s.match(/(\d+)(?:\s*(?:to|–|-)\s*\d+)?\s*minutes?/i); return m? Number(m[1]) : null; }
function paintCook(){
  const el = $("#cook"); if(!el) return; const r = cook.r, n = r.steps.length;
  if(cook.i >= n){
    const v = V("Deuteronomy 8:10");
    el.innerHTML = `<div class="cook-in"><div class="bar"><span class="count">Done</span><button class="iconbtn" data-act="cook-close" aria-label="Close">${I.close}</button></div>
      <div class="body"><p style="font-size:clamp(1.3rem,5vw,1.8rem)">“${esc(v.t)}”</p><p class="core-ref" style="font-size:1.5rem">${v.r}</p></div>
      <button class="btn block" style="padding:18px" data-act="cook-finish">Mark as cooked</button></div>`;
    return;
  }
  const s = r.steps[cook.i], mins = stepMinutes(s);
  el.innerHTML = `<div class="cook-in"><div class="bar"><span class="count">Step ${cook.i+1} of ${n}</span><button class="iconbtn" data-act="cook-close" aria-label="Close Cook With Me">${I.close}</button></div>
    <div class="progress" style="margin-top:10px"><i style="width:${Math.round((cook.i)/n*100)}%"></i></div>
    <div class="body" aria-live="polite"><p>${esc(s)}</p>
      ${mins? `<div class="timer">${cook.timer!=null? `<b id="tleft">${fmtTime(cook.timer)}</b><button class="btn soft" data-act="timer-stop">Stop timer</button>` : `<button class="btn soft" data-act="timer" data-v="${mins}">Start ${mins}-minute timer</button>`}</div>`:""}
    </div>
    <div class="nav2"><button class="btn soft" data-act="cook-prev" ${cook.i===0?"disabled":""}>Back</button><button class="btn" data-act="cook-next">${cook.i===n-1?"Finish":"Next step"}</button></div></div>`;
}
const fmtTime = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function chime(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3);}); }catch(e){} try{navigator.vibrate?.([300,150,300]);}catch(e){} }
function stopTimer(){ clearInterval(timerInt); timerInt=null; if(cook) cook.timer=null; }
function endCook(){ stopTimer(); try{ wake?.release(); }catch(e){} wake=null; $("#cook")?.remove(); cook=null; }

async function runMeals(){
  const box = $("#askInput"); const q = box? box.value.trim() : "";
  const up = $("#usePantry"); if(up) usePantry = up.checked;
  const pantry = usePantry? state.pantry : [];
  if(!q && !pantry.length){ aiError = "Tell us a few ingredients you have, or add some in My Kitchen."; repaint(); return; }
  if(!sample){ aiError = aiErr(null); repaint(); return; }
  aiLoading = true; aiError = ""; aiResults = null; repaint(); const keep = q;
  askCtl = new AbortController();
  const soon = pantry.filter(p=>{const n=daysLeft(p.expires);return n!=null&&n<=4;}).map(p=>p.name);
  const prompt = `You are the kitchen helper inside Daily Bread, a home cooking app. Suggest exactly 3 home-cooked meals for this person.
Their request: "${q || "Something good with what I have."}"
${askTime? `Time available: about ${askTime===60?"60 or more":askTime} minutes total. Every recipe must fit.` : "If they mention a time limit, every recipe must fit it."}
Ingredients on hand: ${pantry.length? pantry.map(p=>p.name).join(", ") : "only what they listed in the request"}.
${soon.length? "Use these first, they expire soon: "+soon.join(", ")+"." : ""}
${profileLine()}
Assume salt, black pepper, water, and cooking oil are available. Favor recipes that use what they already have and need few extra purchases. Make the three meaningfully different.
Write clear steps a ${state.profile.skill.toLowerCase()} home cook can follow, with times and heat levels. Include safe internal temperatures for meat, poultry, fish, egg dishes, and reheated leftovers where relevant (USDA guidance).
Reply with only a JSON array of 3 objects in this shape:
[{"title":"","summary":"one sentence","emoji":"one food emoji","time_minutes":40,"servings":${state.profile.household},"difficulty":"Beginner","ingredients":[{"qty":1.5,"unit":"lb","name":"chicken thighs","have":true}],"steps":["..."],"nutrition":{"calories":0,"protein_g":0,"carbs_g":0,"fat_g":0},"tags":["Dinner"]}]
Use units from: cup, tbsp, tsp, lb, oz, g, ml, clove, can, pinch, or "" for counts. "have" is true when the ingredient is on hand. Nutrition is a per-serving estimate.`;
  try{
    const out = await sample.json(prompt, {signal: askCtl.signal, cache:false});
    const arr = Array.isArray(out)? out : (out && Array.isArray(out.meals)? out.meals : []);
    aiResults = arr.slice(0,3).map(o=>normRecipe(o,{ai:true}));
    if(!aiResults.length) aiError = "No meals came back. Try listing a few more ingredients.";

async function sendChat(){
  const box = $("#chatInput"); const q = box? box.value.trim() : ""; if(!q || chatLoading) return;
  if(!sample){ aiError = aiErr(null); repaint(); return; }
  chat.push({role:"user",content:q}); chatLoading = true; aiError=""; repaint();
  const RULES = `You are the kitchen helper in Daily Bread, a warm home-cooking app. Answer cooking questions in plain text under 150 words, friendly and practical, no headings or markdown. ${profileLine()} For food safety, follow established guidance (USDA, FDA) and say "when in doubt, throw it out" where it applies. For canning or shelf-stable preserves, point to tested recipes from the National Center for Home Food Preservation. If a question is not about food or cooking, gently steer back.`;
  const turns = chat.slice(-10);
  const ctl = new AbortController(); askCtl = ctl;
  try{
    const res = await sample([{role:"user",content:RULES},...turns], {cache:false, signal:ctl.signal, modelTier:"quick", onText:({text})=>{ const log=$("#chatLog"); if(log){ let b=log.querySelector(".bubble.ai.live"); if(!b){ log.querySelector(".thinking")?.remove(); b=document.createElement("div"); b.className="bubble ai live"; log.appendChild(b);} b.textContent=text; } }});

    const out = await sample.json(file? EXTRACT + "\nThe material is in the attached image." : EXTRACT + "\n\nMaterial:\n" + text.slice(0,12000), file? {images:[file], cache:false} : {cache:false});
    if(!out || out.error || !Array.isArray(out.ingredients) || !out.ingredients.length){ impError = "We couldn’t find a recipe in that. Paste the full caption or ingredient list, or type it in."; }
    else { const r = normRecipe(out); impDraft = {fromAI:true, title:r.title, servings:r.servings, time:r.time, ingredients:r.ingredients, steps:r.steps, creator: out.creator||"", url: url||"", emoji:r.emoji, summary:r.summary, tags:r.tags}; }
  }catch(e){ impError = aiErr(e); }
  impLoading = false; repaint();
}

/* Tutorials */
function tutView(id){
  const t = TUTORIALS.find(x=>x.id===id), done = state.progress[t.id]||[], rel = t.related && SEED.find(r=>r.id===t.related);
  return `<div class="hero"><span class="plate lg">${t.emoji}</span><h1 style="font-size:1.7rem">${esc(t.title)}</h1><p class="muted" style="margin-top:8px">${esc(t.intro)}</p>
    <div class="meta"><span><b>${esc(t.difficulty)}</b>level</span><span><b>${done.length}/${t.steps.length}</b>steps done</span></div></div>
  ${verseInline(t.verse)}
  <div class="section"><h2 style="margin-bottom:8px">You’ll need</h2><ul class="ing">${t.ingredients.map(i=>`<li><span class="dot n"></span><span>${esc(i)}</span></li>`).join("")}</ul></div>
  <div class="section"><h2 style="margin-bottom:8px">Equipment</h2><p>${t.equipment.map(esc).join(", ")}.</p><p class="small muted" style="margin-top:6px">${esc(t.time)}</p></div>
  <div class="section"><h2 style="margin-bottom:4px">Step by step</h2><p class="small muted">Check off each step as you go. Your progress is saved.</p>
    ${t.steps.map((s,i)=>`<label class="check ${done.includes(i)?"done":""}"><input type="checkbox" data-act="tut-step" data-v="${t.id}" data-i="${i}" ${done.includes(i)?"checked":""}><span>${esc(s)}</span></label>`).join("")}</div>
  <div class="section"><h2>Troubleshooting</h2><dl class="tr">${t.trouble.map(([q,a])=>`<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join("")}</dl></div>
  <div class="section"><h2 style="margin-bottom:6px">Storing it</h2><p>${esc(t.storage)}</p></div>
  ${rel? `<div class="section"><h2 style="margin-bottom:10px">Put it to use</h2>${recipeCard(rel)}</div>`:""}
  <div class="sticky-actions"><button class="btn ghost" data-act="tut-ask" data-v="${t.id}">Ask about this</button><button class="btn" data-act="tut-save" data-v="${t.id}">Save to cookbook</button></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  const p = state.profile;
  switch(a){
    case "ob-next": if(obStep<2){ obStep++; } else obStep=3; render(); break;
    case "ob-skip": obStep=3; render(); break;
    case "hh": p.household = Math.max(1, Math.min(12, p.household + Number(v))); $("#hhv").textContent = p.household; break;
    case "diet": { const i=p.diet.indexOf(v); i>=0? p.diet.splice(i,1) : p.diet.push(v); el.setAttribute("aria-pressed", i<0); break; }
    case "skill": p.skill = v; document.querySelectorAll('[data-act="skill"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v)); break;
    case "ob-finish": p.name = ($("#pName").value||"").trim(); state.onboarded = true; save(); render(); window.scrollTo(0,0); break;
    case "prefs": openSheet(prefsView); break;
    case "prefs-save": p.name = ($("#pName").value||"").trim(); save(); sheetStack.pop(); paintSheet(); render(); toast("Preferences saved"); break;
    case "tab": if(sheetStack.length){ sheetStack.length=0; paintSheet(); } tab = v; render(); window.scrollTo(0,0); break;
    case "filter": filter = v; document.querySelectorAll('[data-act="filter"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v)); $("#dres").innerHTML = renderDiscoverResults(); break;
    case "coll": coll = v; render(); break;
    case "open": { const r = SEED.find(x=>x.id===v); if(r){ cur=null; openRecipe(r); } break; }
    case "open-cb": { const en = state.cookbook.find(x=>x.id===v); if(en){ cur=null; openRecipe(en.recipe, en.id); } break; }
    case "open-ai": { const r = aiResults && aiResults[Number(v)]; if(r){ cur=null; openRecipe(r); } break; }
    case "serv": cur.serv = Math.max(1, Math.min(24, cur.serv + Number(v))); repaint(); break;
    case "save-open": openSheet(collectionPicker); break;
    case "save-to": saveToCookbook(v); sheetStack.pop(); repaint(); break;
    case "note-save": { const en = state.cookbook.find(x=>x.id===cur.cbId); if(en){ en.notes = $("#cbNote").value; en.collection = $("#cbColl").value; save(); toast("Notes saved"); } break; }
    case "cb-del": if(confirm("Remove this recipe from your cookbook?")){ state.cookbook = state.cookbook.filter(x=>x.id!==cur.cbId); save(); sheetStack.pop(); paintSheet(); render(); toast("Removed"); } break;
    case "cook": startCook(); break;
    case "cook-next": stopTimer(); cook.i++; paintCook(); break;
    case "cook-prev": stopTimer(); cook.i = Math.max(0,cook.i-1); paintCook(); break;
    case "cook-close": endCook(); break;
    case "cook-finish": { state.cookedCount = (state.cookedCount||0)+1; const en = cur && cur.cbId && state.cookbook.find(x=>x.id===cur.cbId); if(en){ en.cooked=(en.cooked||0)+1; en.lastCooked=Date.now(); } save(); endCook(); toast("Marked as cooked. Enjoy!"); break; }
    case "timer": { stopTimer(); cook.timer = Number(v)*60; paintCook(); timerInt = setInterval(()=>{ if(!cook){stopTimer();return;} cook.timer--; const t=$("#tleft"); if(t) t.textContent = fmtTime(Math.max(0,cook.timer)); if(cook.timer<=0){ stopTimer(); chime(); paintCook(); toast("Timer done"); } },1000); break; }
    case "timer-stop": stopTimer(); paintCook(); break;
    case "ask-home": { const q = $("#homeAsk").value.trim(); usePantry = true; openAssistant(q, "meals", !!q); break; }
    case "ask-open": openAssistant(null,"meals"); break;
    case "cook-pantry": usePantry = true; openAssistant("", "meals", true); break;
    case "ask-mode": { const keep = $("#askInput")?.value; askMode = v; aiError=""; repaint(); if(v==="meals" && keep) $("#askInput").value = keep; break; }
    case "ask-time": { const keep = $("#askInput").value; askTime = askTime===Number(v)? null : Number(v); repaint(); $("#askInput").value = keep; break; }
    case "ask-run": runMeals(); break;
    case "ask-stop": askCtl?.abort(); break;
    case "chat-send": sendChat(); break;
    case "scan": $("#fileScan").value=""; $("#fileScan").click(); break;
    case "scan-toggle": scanItems[Number(v)].on = el.checked; { const b=$('[data-act="scan-save"]'); if(b) b.textContent = `Save ${scanItems.filter(s=>s.on).length} items`; } break;
    case "scan-save": { let n=0; scanItems.filter(s=>s.on && s.name.trim()).forEach(s=>{ state.pantry.push({id:uid(),name:s.name.trim(),qty:s.qty,unit:s.unit,location:s.location,expires:s.expires,added:isoDay(today0())}); n++; }); save(); scanItems=null; sheetStack.length=0; paintSheet(); tab="kitchen"; render(); toast(`Added ${n} items to My Kitchen`); break; }
    case "add-item": editing = {name:"",qty:"",unit:"",location:"Fridge",expires:""}; if(sheetStack.length && sheetStack[sheetStack.length-1]===scanView) sheetStack.pop(); openSheet(itemView); break;
    case "edit-item": editing = Object.assign({}, state.pantry.find(x=>x.id===v)); openSheet(itemView); break;
    case "item-save": { const name = $("#iName").value.trim(); if(!name){ $("#iName").focus(); return; }
      const it = {name, qty: parseQty($("#iQty").value||"")||null, unit: $("#iUnit").value.trim(), location: $("#iLoc").value, expires: $("#iExp").value};
      if(editing.id){ Object.assign(state.pantry.find(x=>x.id===editing.id), it); } else state.pantry.push(Object.assign({id:uid(),added:isoDay(today0())},it));
      save(); sheetStack.pop(); paintSheet(); render(); toast(editing.id? "Item updated":"Added to My Kitchen"); break; }
    case "item-del": state.pantry = state.pantry.filter(x=>x.id!==editing.id); save(); sheetStack.pop(); paintSheet(); render(); toast("Removed"); break;
    case "import": impMode="link"; impDraft=null; impError=""; openSheet(importView); break;
    case "imp-mode": impMode = v; impError=""; repaint(); break;
    case "imp-extract": { const url=$("#impUrl").value.trim(), text=$("#impText").value.trim(); if(!text){ impError = url? "Paste the caption or recipe text too. Most social links don’t share the recipe itself." : "Paste a link and the recipe text to continue."; repaint(); if(url) $("#impUrl").value=url; return; } extract(text,null,url); break; }
    case "imp-shot": $("#fileShot").value=""; $("#fileShot").click(); break;
    case "imp-blank": impDraft = {fromAI:false,title:"",servings:4,time:"",ingredients:[],steps:[],creator:"",url:"",collection:"Family Favorites"}; repaint(); break;
    case "imp-discard": impDraft=null; repaint(); break;
    case "imp-save": { const title=$("#dTitle").value.trim(); if(!title){ $("#dTitle").focus(); return; }
      const url=$("#dUrl").value.trim(), creator=$("#dCreator").value.trim();
      const recipe = {id:"c"+uid(), title, emoji: impDraft.emoji||"📖", summary: impDraft.summary||"", time:Number($("#dTime").value)||null, servings:Number($("#dServ").value)||4, difficulty:"Beginner", tags: impDraft.tags||[],
        ingredients: $("#dIng").value.split("\n").map(s=>s.trim()).filter(Boolean).map(parseLine), steps: $("#dSteps").value.split("\n").map(s=>s.trim()).filter(Boolean), nutrition:null, ai:false,
        source: (url||creator)? {url, creator, platform: guessPlatform(url)} : null};
      state.cookbook.push({id:uid(), recipe, collection:$("#dColl").value, notes:$("#dNotes").value, savedAt:Date.now(), origin: impDraft.fromAI? "import":"manual"});
      save(); impDraft=null; sheetStack.length=0; paintSheet(); tab="cookbook"; coll="All"; render(); toast("Saved to your cookbook"); break; }
    case "tut": openSheet(()=>tutView(v)); break;
    case "tut-step": { const arr = state.progress[v] = state.progress[v]||[]; const i = Number(el.dataset.i); const k = arr.indexOf(i); k>=0? arr.splice(k,1) : arr.push(i); save(); el.closest(".check").classList.toggle("done", el.checked); break; }
    case "tut-ask": { const t = TUTORIALS.find(x=>x.id===v); chat=[]; openAssistant(`I’m working on “${t.title}.” `, "chat"); const c=$("#chatInput"); if(c){ c.focus(); c.setSelectionRange(c.value.length,c.value.length);} break; }
    case "tut-save": { const t = TUTORIALS.find(x=>x.id===v); if(state.cookbook.some(x=>x.recipe.tutorialId===t.id)){ toast("Already in your cookbook"); break; }
      state.cookbook.push({id:uid(), collection: t.path==="bread"? "Bread & Sourdough" : "From Scratch", notes:"", savedAt:Date.now(), origin:"scratch",
        recipe:{id:"c"+uid(), tutorialId:t.id, title:t.title, emoji:t.emoji, summary:t.intro, time:null, servings:1, difficulty:t.difficulty, tags:["From Scratch"], ingredients:t.ingredients.map(parseLine), steps:t.steps, nutrition:null, ai:false}});
      save(); toast("Saved to your cookbook"); break; }
    case "sheet-back": sheetStack.pop(); if(!sheetStack.length){ askCtl?.abort(); } paintSheet(); if(!sheetStack.length) render(); break;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="search"){ query = e.target.value; $("#dres").innerHTML = renderDiscoverResults(); }
  const si = e.target.dataset && e.target.dataset.scan; if(si!=null && scanItems){ scanItems[Number(si)][e.target.dataset.k] = e.target.value; }
});
document.addEventListener("change", e=>{ const si = e.target.dataset && e.target.dataset.scan; if(si!=null && scanItems){ scanItems[Number(si)][e.target.dataset.k] = e.target.value; } });
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey && e.target.id==="chatInput"){ e.preventDefault(); sendChat(); }
  if(e.key==="Escape"){ if($("#cook")) endCook(); else if(sheetStack.length){ sheetStack.pop(); paintSheet(); if(!sheetStack.length) render(); } }
  if($("#cook") && cook && (e.key==="ArrowRight"||e.key===" ") && e.target===document.body){ e.preventDefault(); stopTimer(); cook.i++; paintCook(); }
  if($("#cook") && cook && e.key==="ArrowLeft"){ stopTimer(); cook.i=Math.max(0,cook.i-1); paintCook(); }
});
$("#fileScan").addEventListener("change", e=>handleScan(e.target.files[0]));
$("#fileShot").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) extract("", f, ""); });

render();
</script>
